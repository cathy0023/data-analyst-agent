[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-analyst-agent"
version = "0.0.1"
description = "Python SDK for embedding conversational data analysis (NL → SQL → result → conclusion) into applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "data-analyst-agent contributors" }]
keywords = ["nl2sql", "agent", "data-analysis", "llm", "sdk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic==0.50.*",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "sqlglot>=25.0,<26.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-json-logger>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
    "freezegun>=1.5",
    "pytest-postgresql>=5.0",
]

[project.urls]
Homepage = "https://github.com/cathy0023/data-analyst-agent"
Repository = "https://github.com/cathy0023/data-analyst-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "live: marks tests that call real Anthropic API (deselect with '-m \"not live\"')",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
